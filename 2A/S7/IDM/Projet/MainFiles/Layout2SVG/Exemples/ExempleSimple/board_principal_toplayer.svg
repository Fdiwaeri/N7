<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000.0" height="800.0" viewBox="0 0 1000.0 800.0">
  <title>board principal - toplayer</title>
  <rect width="100%" height="100%" fill="white"/>
  <!-- Grille -->
  <defs>
    <pattern id="grid" width="100.0" height="100.0" patternUnits="userSpaceOnUse">
      <path d="M 100.0 0 L 0 0 0 100.0" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect x="0" y="0" width="1000.0" height="800.0" fill="none" stroke="black" stroke-width="3"/>

  <!-- Composants -->
  <g id="B1">
    <rect x="200.0" y="225.0" width="100.0" height="150.0" fill="#45B7D1" fill-opacity="0.7" stroke="#333" stroke-width="2"/>
    <text x="300.0" y="375.0" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="black">B1</text>
  </g>
  <g id="R1">
    <rect x="590.0" y="275.0" width="20.0" height="50.0" fill="#45B7D1" fill-opacity="0.7" stroke="#333" stroke-width="2"/>
    <text x="610.0" y="325.0" font-family="Arial" font-size="10" text-anchor="middle" dominant-baseline="middle" fill="black">R1</text>
  </g>

  <!-- Pistes -->
  <polyline points="600.0,300.0 200.0,300.0 " fill="none" stroke="#FF6B6B" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200.0" y="300.0" font-family="Arial" font-size="8" fill="#FF6B6B">piste1</text>

  <!-- Légende -->
  <text x="10" y="790.0" font-family="Arial" font-size="12" fill="black">board principal - toplayer</text>
</svg>